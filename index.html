<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Симулятор бытовых дел</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #2c3e50;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            touch-action: none;
            padding: 8px;
        }
        #game {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 4/3;
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            background: linear-gradient(180deg, #87CEEB 0%, #B5E6F7 45%, #F0F8A0 65%, #7CCD7C 72%, #5BAF5B 100%);
            touch-action: none;
        }
        /* На телефонах фиксируем размер */
        @media (max-width: 700px) {
            #game {
                aspect-ratio: unset;
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
                max-width: 100vw;
            }
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        #buttons {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 0 8px;
            z-index: 10;
            width: 98%;
            max-width: 720px;
            pointer-events: none;
        }
        #buttons .btn {
            pointer-events: auto;
            flex: 1 0 calc(20% - 6px);
            min-width: 55px;
            max-width: 120px;
            padding: 8px 4px;
            border: none;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(180deg, #5DADE2, #2E86C1);
            box-shadow: 0 4px 0 #1A5276, 0 6px 16px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: all 0.08s ease;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
            font-family: inherit;
            touch-action: manipulation;
            border: 2px solid rgba(255, 255, 255, 0.15);
            -webkit-tap-highlight-color: transparent;
        }
        #buttons .btn .icon {
            font-size: 20px;
            line-height: 1.2;
        }
        #buttons .btn .label {
            font-size: 10px;
            opacity: 0.95;
            white-space: nowrap;
            line-height: 1.2;
        }
        #buttons .btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #1A5276;
        }
        #buttons .btn:disabled {
            opacity: 0.5;
            transform: translateY(2px);
            box-shadow: 0 2px 0 #1A5276;
            cursor: not-allowed;
        }
        #buttons .btn.done {
            background: linear-gradient(180deg, #58D68D, #28B463);
            box-shadow: 0 4px 0 #1E8449;
        }
        #buttons .btn.done .label::after {
            content: ' ✅';
            font-size: 10px;
        }

        /* Телефоны — кнопки больше */
        @media (max-width: 600px) {
            #buttons {
                gap: 5px;
                bottom: 8px;
                padding: 0 4px;
                width: 100%;
            }
            #buttons .btn {
                flex: 1 0 calc(20% - 4px);
                min-width: 48px;
                padding: 10px 3px;
                border-radius: 12px;
                font-size: 11px;
                box-shadow: 0 3px 0 #1A5276;
            }
            #buttons .btn .icon {
                font-size: 18px;
            }
            #buttons .btn .label {
                font-size: 9px;
                white-space: normal;
                line-height: 1.1;
            }
            #buttons .btn.done .label::after {
                content: '✅';
                font-size: 9px;
            }
        }
        @media (max-width: 400px) {
            #buttons {
                gap: 3px;
                bottom: 5px;
                padding: 0 2px;
            }
            #buttons .btn {
                min-width: 38px;
                padding: 6px 2px;
                border-radius: 8px;
                font-size: 9px;
            }
            #buttons .btn .icon {
                font-size: 14px;
            }
            #buttons .btn .label {
                font-size: 7px;
            }
        }

        #status {
            position: absolute;
            top: 10px;
            right: 14px;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(4px);
            color: #fff;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.15);
            pointer-events: none;
        }
        #status span {
            color: #F1C40F;
        }
        @media (max-width: 600px) {
            #status {
                font-size: 11px;
                padding: 4px 12px;
                top: 6px;
                right: 8px;
            }
        }
        @media (max-width: 400px) {
            #status {
                font-size: 9px;
                padding: 3px 8px;
                top: 4px;
                right: 6px;
            }
        }

        #victory {
            position: absolute;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 20;
            animation: fadeIn 0.6s ease;
            padding: 20px;
        }
        #victory.show {
            display: flex;
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        #victoryCard {
            background: #fffdf8;
            border-radius: 28px;
            padding: 30px 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            animation: bounceIn 0.6s ease;
            max-width: 90vw;
            width: 420px;
        }
        @keyframes bounceIn {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }
            60% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        #victoryCard .trophy {
            font-size: 70px;
            display: block;
        }
        #victoryCard h1 {
            font-size: 32px;
            margin: 8px 0 4px;
            background: linear-gradient(135deg, #F1C40F, #F39C12);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #victoryCard p {
            font-size: 18px;
            color: #555;
            margin: 8px 0 16px;
        }
        #victoryCard .btn-restart {
            padding: 14px 44px;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #F1C40F, #F39C12);
            box-shadow: 0 4px 0 #B7950B;
            cursor: pointer;
            transition: all 0.1s;
            font-family: inherit;
            touch-action: manipulation;
        }
        #victoryCard .btn-restart:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #B7950B;
        }
        @media (max-width: 500px) {
            #victoryCard {
                padding: 20px 24px;
                width: 100%;
            }
            #victoryCard .trophy {
                font-size: 50px;
            }
            #victoryCard h1 {
                font-size: 24px;
            }
            #victoryCard p {
                font-size: 15px;
            }
            #victoryCard .btn-restart {
                font-size: 15px;
                padding: 12px 28px;
            }
        }
    </style>
</head>
<body>

    <div id="game">
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <div id="status">Выполнено: <span id="taskCount">0</span> / 5</div>

        <div id="buttons">
            <button class="btn" data-task="0"><span class="icon">🌿</span><span class="label">Покосить газон</span></button>
            <button class="btn" data-task="1"><span class="icon">🐕</span><span class="label">Покормить Лео</span></button>
            <button class="btn" data-task="2"><span class="icon">🔧</span><span class="label">Починить машину</span></button>
            <button class="btn" data-task="3"><span class="icon">💪</span><span class="label">Потренироваться</span></button>
            <button class="btn" data-task="4"><span class="icon">❤️</span><span class="label">Поцеловать жену</span></button>
        </div>

        <div id="victory">
            <div id="victoryCard">
                <span class="trophy">🏆</span>
                <h1>Все дела сделаны!</h1>
                <p>Ты — супер-хозяин! 🎉</p>
                <button class="btn-restart" id="restartBtn">🔄 Сыграть снова</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const W = 800,
                H = 600;

            const tasks = [false, false, false, false, false];
            let animating = false;
            let animTimer = null;
            let victoryShown = false;
            let frame = 0;
            let particles = [];

            const man = {
                x: 400,
                y: 360,
                action: 'idle',
                walkDir: 1,
                speed: 2
            };
            const wife = { x: 490, y: 350, visible: false };
            const dog = { x: 310, y: 375, visible: false };
            const car = { x: 540, y: 365, visible: false };
            const lawnmower = { x: 0, y: 0, visible: false };
            const foodBowl = { x: 0, y: 0, visible: false };

            const buttons = document.querySelectorAll('.btn');
            const taskCount = document.getElementById('taskCount');
            const victory = document.getElementById('victory');
            const restartBtn = document.getElementById('restartBtn');

            function updateUI() {
                const done = tasks.filter(Boolean).length;
                taskCount.textContent = done;
                buttons.forEach((btn, i) => {
                    if (i < 5) {
                        if (tasks[i]) {
                            btn.classList.add('done');
                            btn.disabled = true;
                        } else {
                            btn.classList.remove('done');
                            btn.disabled = animating;
                        }
                    }
                });
                if (done === 5 && !victoryShown) {
                    showVictory();
                }
            }

            function addParticles(type, x, y, count, opts) {
                for (let i = 0; i < count; i++) {
                    const angle = (Math.random() * 2 - 1) * (opts?.spread || 1.5);
                    const speed = 50 + Math.random() * (opts?.speed || 120);
                    const size = 4 + Math.random() * (opts?.size || 8);
                    particles.push({
                        x,
                        y,
                        vx: Math.cos(angle) * speed * (opts?.dirX || 1),
                        vy: -Math.sin(angle) * speed * 0.7 - (opts?.rise || 40),
                        life: 60 + Math.random() * 40,
                        maxLife: 60 + Math.random() * 40,
                        type,
                        size,
                        color: opts?.color || '#F1C40F',
                        rot: Math.random() * Math.PI * 2
                    });
                }
            }

            function updateParticles() {
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx * 0.016;
                    p.y += p.vy * 0.016;
                    p.vy += 20 * 0.016;
                    p.life--;
                    if (p.life <= 0) {
                        particles.splice(i, 1);
                    }
                }
                if (particles.length > 300) particles.splice(0, particles.length - 300);
            }

            function drawParticles() {
                for (const p of particles) {
                    const alpha = p.life / p.maxLife;
                    ctx.save();
                    ctx.globalAlpha = alpha;
                    ctx.translate(p.x, p.y);

                    if (p.type === 'heart') {
                        ctx.fillStyle = p.color;
                        ctx.font = `${p.size * 1.5}px Arial`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('❤️', 0, 0);
                    } else if (p.type === 'spark') {
                        ctx.fillStyle = p.color;
                        ctx.shadowColor = p.color;
                        ctx.shadowBlur = 12;
                        ctx.beginPath();
                        ctx.arc(0, 0, p.size * 0.4, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (p.type === 'grass') {
                        ctx.fillStyle = p.color;
                        ctx.fillRect(-p.size * 0.2, -p.size * 0.8, p.size * 0.4, p.size * 0.8);
                        ctx.fillRect(-p.size * 0.1, -p.size * 0.6, p.size * 0.2, p.size * 0.6);
                    } else if (p.type === 'star') {
                        ctx.fillStyle = p.color;
                        ctx.font = `${p.size}px Arial`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('⭐', 0, 0);
                    } else if (p.type === 'sweat') {
                        ctx.fillStyle = '#85C1E9';
                        ctx.globalAlpha = alpha * 0.7;
                        ctx.beginPath();
                        ctx.ellipse(0, 0, p.size * 0.3, p.size * 0.5, 0, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.arc(0, 0, p.size * 0.5, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.restore();
                }
            }

            // ===== Отрисовка сцены =====
            function drawScene() {
                ctx.fillStyle = '#87CEEB';
                ctx.fillRect(0, 0, W, H * 0.45);

                drawCloud(80, 60, 100);
                drawCloud(550, 40, 80);
                drawCloud(300, 100, 70);

                ctx.fillStyle = '#FFD93D';
                ctx.shadowColor = '#FFD93D';
                ctx.shadowBlur = 40;
                ctx.beginPath();
                ctx.arc(740, 60, 40, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.fillStyle = '#8BC34A';
                ctx.beginPath();
                ctx.moveTo(0, 240);
                for (let x = 0; x <= W; x += 40) {
                    ctx.quadraticCurveTo(x + 20, 200 + Math.sin(x * 0.03 + 1) * 30, x + 40, 240);
                }
                ctx.lineTo(W, 0);
                ctx.lineTo(0, 0);
                ctx.fill();

                ctx.fillStyle = '#7CB342';
                ctx.beginPath();
                ctx.moveTo(0, 270);
                for (let x = 0; x <= W; x += 50) {
                    ctx.quadraticCurveTo(x + 25, 230 + Math.sin(x * 0.025 + 3) * 25, x + 50, 270);
                }
                ctx.lineTo(W, 0);
                ctx.lineTo(0, 0);
                ctx.fill();

                ctx.fillStyle = '#66BB6A';
                ctx.fillRect(0, 270, W, H - 270);

                for (let i = 0; i < 80; i++) {
                    const x = (i * 47 + 13) % W;
                    const y = 280 + (i * 31 + 7) % (H - 300);
                    ctx.strokeStyle = i % 3 ? 'rgba(60,140,50,0.2)' : 'rgba(200,255,180,0.15)';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(x, y + 6);
                    ctx.lineTo(x + 2 + Math.sin(i) * 2, y);
                    ctx.stroke();
                }

                drawHouse(60, 220);
                drawTree(720, 220);
                drawFence(200, 275);

                if (car.visible) drawCar(car.x, car.y);
                if (dog.visible) drawDog(dog.x, dog.y);
                if (wife.visible) drawWife(wife.x, wife.y);
                drawMan(man.x, man.y);
                if (lawnmower.visible) drawLawnmower(man.x + 40, man.y + 20);
                if (foodBowl.visible) drawFoodBowl(man.x + 30, man.y + 25);

                drawParticles();
            }

            function drawCloud(x, y, size) {
                ctx.fillStyle = 'rgba(255,255,255,0.85)';
                ctx.shadowColor = 'rgba(255,255,255,0.2)';
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(x, y, size * 0.4, 0, Math.PI * 2);
                ctx.arc(x + size * 0.3, y - size * 0.2, size * 0.5, 0, Math.PI * 2);
                ctx.arc(x + size * 0.6, y, size * 0.35, 0, Math.PI * 2);
                ctx.arc(x + size * 0.3, y + size * 0.1, size * 0.35, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            function drawHouse(x, y) {
                ctx.fillStyle = '#D4A574';
                ctx.fillRect(x, y + 30, 80, 60);
                ctx.fillStyle = '#B8956A';
                ctx.fillRect(x + 30, y + 60, 20, 30);

                ctx.fillStyle = '#A0522D';
                ctx.beginPath();
                ctx.moveTo(x - 10, y + 30);
                ctx.lineTo(x + 40, y - 10);
                ctx.lineTo(x + 90, y + 30);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#5DADE2';
                ctx.fillRect(x + 10, y + 40, 18, 18);
                ctx.fillRect(x + 52, y + 40, 18, 18);

                ctx.fillStyle = '#8D6E63';
                ctx.fillRect(x + 60, y - 5, 12, 20);
                ctx.fillStyle = 'rgba(200,200,200,0.3)';
                ctx.beginPath();
                ctx.arc(x + 66, y - 12, 6, 0, Math.PI * 2);
                ctx.arc(x + 70, y - 22, 8, 0, Math.PI * 2);
                ctx.arc(x + 62, y - 30, 6, 0, Math.PI * 2);
                ctx.fill();
            }

            function drawTree(x, y) {
                ctx.fillStyle = '#8D6E63';
                ctx.fillRect(x + 8, y + 20, 14, 40);
                ctx.fillStyle = '#4CAF50';
                ctx.beginPath();
                ctx.arc(x + 15, y + 10, 35, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#66BB6A';
                ctx.beginPath();
                ctx.arc(x - 5, y + 15, 28, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x + 35, y + 15, 28, 0, Math.PI * 2);
                ctx.fill();
            }

            function drawFence(x, y) {
                ctx.strokeStyle = '#B8956A';
                ctx.lineWidth = 2;
                for (let i = 0; i < 14; i++) {
                    const fx = x + i * 18;
                    ctx.beginPath();
                    ctx.moveTo(fx, y);
                    ctx.lineTo(fx, y - 20);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(fx - 2, y - 12);
                    ctx.lineTo(fx + 2, y - 12);
                    ctx.stroke();
                }
                ctx.beginPath();
                ctx.moveTo(x, y - 6);
                ctx.lineTo(x + 14 * 18, y - 6);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x, y - 14);
                ctx.lineTo(x + 14 * 18, y - 14);
                ctx.stroke();
            }

            // ===== Мужчина с ходьбой =====
            function drawMan(x, y) {
                const jump = man.action === 'pushup' ? Math.abs(Math.sin(frame * 0.1)) * 16 : 0;
                const actualY = y - jump;

                ctx.save();
                ctx.translate(x, actualY);

                ctx.fillStyle = 'rgba(0,0,0,0.1)';
                ctx.beginPath();
                ctx.ellipse(0, 44 + jump, 25, 6, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#2C3E50';
                ctx.lineWidth = 10;
                ctx.lineCap = 'round';
                const walk = man.action === 'mowing' ? Math.sin(frame * 0.15) * 8 : 0;
                const jumpLeg = man.action === 'pushup' ? Math.sin(frame * 0.15) * 8 : 0;
                ctx.beginPath();
                ctx.moveTo(-6, 26);
                ctx.lineTo(-8 + walk + jumpLeg, 44);
                ctx.moveTo(6, 26);
                ctx.lineTo(8 - walk - jumpLeg, 44);
                ctx.stroke();

                ctx.fillStyle = '#1A252F';
                ctx.fillRect(-14 + walk + jumpLeg, 44, 12, 5);
                ctx.fillRect(2 - walk - jumpLeg, 44, 12, 5);

                ctx.fillStyle = '#3498DB';
                ctx.beginPath();
                ctx.roundRect(-16, -4, 32, 32, 6);
                ctx.fill();
                ctx.fillStyle = '#2980B9';
                ctx.fillRect(-10, -2, 20, 8);

                ctx.strokeStyle = '#F5D0B8';
                ctx.lineWidth = 8;
                const armSwing = man.action === 'mowing' ? Math.sin(frame * 0.15) * 20 : 0;
                const armSwing2 = man.action === 'mowing' ? Math.cos(frame * 0.15) * 10 : 0;
                const jumpArm = man.action === 'pushup' ? Math.sin(frame * 0.12) * 20 : 0;
                ctx.beginPath();
                ctx.moveTo(-16, 4);
                ctx.lineTo(-28 + armSwing + jumpArm, 20 + armSwing2 + jumpArm * 0.3);
                ctx.moveTo(16, 4);
                ctx.lineTo(28 - armSwing - jumpArm, 20 - armSwing2 - jumpArm * 0.3);
                ctx.stroke();

                ctx.fillStyle = '#F5D0B8';
                ctx.beginPath();
                ctx.arc(0, -20, 20, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(255,255,255,0.15)';
                ctx.beginPath();
                ctx.ellipse(5, -26, 10, 6, -0.3, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#2C3E50';
                ctx.beginPath();
                ctx.arc(-6, -22, 3, 0, Math.PI * 2);
                ctx.arc(6, -22, 3, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#C0392B';
                ctx.lineWidth = 2;
                if (man.action === 'pushup') {
                    ctx.beginPath();
                    ctx.arc(0, -12, 5, 0.15, Math.PI - 0.15);
                    ctx.stroke();
                } else if (man.action === 'mowing') {
                    ctx.beginPath();
                    ctx.arc(0, -14, 6, 0.1, Math.PI - 0.1);
                    ctx.stroke();
                } else {
                    ctx.beginPath();
                    ctx.arc(0, -14, 5, 0.15, Math.PI - 0.15);
                    ctx.stroke();
                }

                ctx.restore();

                if (man.action === 'mowing') {
                    lawnmower.x = man.x + 40;
                    lawnmower.y = man.y + 20;
                }
            }

            function updateManPosition() {
                if (man.action === 'mowing') {
                    man.x += man.speed * man.walkDir;
                    if (man.x > 480 || man.x < 320) {
                        man.walkDir *= -1;
                    }
                }
            }

            // ===== Жена =====
            function drawWife(x, y) {
                ctx.save();
                ctx.translate(x, y);

                ctx.fillStyle = 'rgba(0,0,0,0.1)';
                ctx.beginPath();
                ctx.ellipse(0, 42, 22, 5, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#F5D0B8';
                ctx.lineWidth = 8;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(-6, 24);
                ctx.lineTo(-8, 40);
                ctx.moveTo(6, 24);
                ctx.lineTo(8, 40);
                ctx.stroke();

                ctx.fillStyle = '#E8BFA0';
                ctx.fillRect(-14, 40, 12, 4);
                ctx.fillRect(2, 40, 12, 4);

                ctx.fillStyle = '#E74C3C';
                ctx.beginPath();
                ctx.moveTo(-16, 0);
                ctx.quadraticCurveTo(0, -6, 16, 0);
                ctx.lineTo(24, 28);
                ctx.lineTo(-24, 28);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#C0392B';
                ctx.fillRect(-14, 12, 28, 3);

                ctx.strokeStyle = '#F5D0B8';
                ctx.lineWidth = 7;
                ctx.lineCap = 'round';
                const hugArm = man.action === 'hug' ? 10 : 0;
                ctx.beginPath();
                ctx.moveTo(-16, 4);
                ctx.lineTo(-26 + hugArm, 16 + hugArm * 0.3);
                ctx.moveTo(16, 4);
                ctx.lineTo(26 - hugArm, 16 - hugArm * 0.3);
                ctx.stroke();

                ctx.fillStyle = '#F5D0B8';
                ctx.fillRect(-4, -4, 8, 6);

                ctx.fillStyle = '#F5D0B8';
                ctx.beginPath();
                ctx.arc(0, -18, 18, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#5D4037';
                ctx.beginPath();
                ctx.arc(0, -24, 20, Math.PI, Math.PI * 2);
                ctx.fill();
                ctx.fillRect(-20, -22, 6, 18);
                ctx.fillRect(14, -22, 6, 18);
                ctx.fillRect(-16, -32, 32, 8);

                ctx.fillStyle = '#2C3E50';
                ctx.beginPath();
                ctx.arc(-5, -20, 2.5, 0, Math.PI * 2);
                ctx.arc(5, -20, 2.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(-4, -21, 1, 0, Math.PI * 2);
                ctx.arc(6, -21, 1, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(226,120,125,0.25)';
                ctx.beginPath();
                ctx.ellipse(-12, -16, 5, 3, 0, 0, Math.PI * 2);
                ctx.ellipse(12, -16, 5, 3, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#C0392B';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, -13, 4.5, 0.15, Math.PI - 0.15);
                ctx.stroke();

                ctx.fillStyle = '#F8BBD0';
                ctx.beginPath();
                ctx.ellipse(-16, -32, 7, 4, -0.3, 0, Math.PI * 2);
                ctx.ellipse(-6, -32, 7, 4, 0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#E91E63';
                ctx.beginPath();
                ctx.arc(-11, -32, 2.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            // ===== Собака =====
            function drawDog(x, y) {
                ctx.save();
                ctx.translate(x, y);

                ctx.fillStyle = 'rgba(0,0,0,0.08)';
                ctx.beginPath();
                ctx.ellipse(2, 34, 28, 6, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#A67B5B';
                ctx.beginPath();
                ctx.ellipse(0, 14, 30, 18, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#D4B896';
                ctx.beginPath();
                ctx.ellipse(6, 18, 16, 12, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#A67B5B';
                ctx.lineWidth = 7;
                ctx.lineCap = 'round';
                const wag = Math.sin(frame * 0.1) * 15;
                ctx.beginPath();
                ctx.moveTo(-28, 10);
                ctx.quadraticCurveTo(-40, -6 + wag, -34, 2 + wag);
                ctx.stroke();

                ctx.fillStyle = '#A67B5B';
                ctx.fillRect(-22, 28, 8, 10);
                ctx.fillRect(-8, 28, 8, 10);

                ctx.fillStyle = '#A67B5B';
                ctx.beginPath();
                ctx.arc(26, 4, 18, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#D4B896';
                ctx.beginPath();
                ctx.ellipse(38, 6, 12, 10, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#8D6E63';
                ctx.beginPath();
                ctx.ellipse(14, -2, 7, 14, -0.4, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(34, -2, 7, 14, 0.4, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#1A252F';
                ctx.beginPath();
                ctx.arc(28, 0, 3.5, 0, Math.PI * 2);
                ctx.arc(36, 0, 3.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(29, -1, 1.5, 0, Math.PI * 2);
                ctx.arc(37, -1, 1.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#6D4C41';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(28, -4, 4, Math.PI * 1.2, Math.PI * 1.8);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(36, -4, 4, Math.PI * 1.2, Math.PI * 1.8);
                ctx.stroke();

                ctx.fillStyle = '#3E2723';
                ctx.beginPath();
                ctx.arc(46, 5, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.beginPath();
                ctx.arc(44, 3, 2, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#F06292';
                ctx.beginPath();
                ctx.ellipse(44, 12, 4, 6, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#E91E63';
                ctx.beginPath();
                ctx.arc(44, 15, 2, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#A67B5B';
                ctx.fillRect(10, 28, 8, 10);
                ctx.fillRect(24, 28, 8, 10);

                ctx.fillStyle = '#D4B896';
                ctx.fillRect(-20, 34, 4, 4);
                ctx.fillRect(-6, 34, 4, 4);
                ctx.fillRect(12, 34, 4, 4);
                ctx.fillRect(26, 34, 4, 4);

                ctx.restore();
            }

            // ===== Машина =====
            function drawCar(x, y) {
                ctx.save();
                ctx.translate(x, y);

                ctx.fillStyle = '#1A5276';
                ctx.beginPath();
                ctx.roundRect(-40, 8, 80, 26, 4);
                ctx.fill();
                ctx.fillStyle = '#154360';
                ctx.fillRect(-20, -8, 40, 18);

                ctx.fillStyle = '#85C1E9';
                ctx.fillRect(-16, -6, 14, 10);
                ctx.fillRect(2, -6, 14, 10);

                ctx.fillStyle = '#1A252F';
                ctx.beginPath();
                ctx.arc(-24, 34, 10, 0, Math.PI * 2);
                ctx.arc(24, 34, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#7F8C8D';
                ctx.beginPath();
                ctx.arc(-24, 34, 4, 0, Math.PI * 2);
                ctx.arc(24, 34, 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#F9E79F';
                ctx.beginPath();
                ctx.arc(-40, 16, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#E74C3C';
                ctx.beginPath();
                ctx.arc(40, 16, 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            function drawLawnmower(x, y) {
                ctx.save();
                ctx.translate(x, y);
                ctx.fillStyle = '#E67E22';
                ctx.beginPath();
                ctx.roundRect(0, 0, 40, 18, 4);
                ctx.fill();
                ctx.fillStyle = '#F39C12';
                ctx.fillRect(6, -6, 28, 8);
                ctx.strokeStyle = '#7F8C8D';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(32, 8);
                ctx.lineTo(44, -4);
                ctx.stroke();
                ctx.fillStyle = '#2C3E50';
                ctx.beginPath();
                ctx.arc(8, 18, 6, 0, Math.PI * 2);
                ctx.arc(32, 18, 6, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(200,200,200,0.3)';
                for (let i = 0; i < 4; i++) {
                    const angle = frame * 0.2 + i * Math.PI / 2;
                    ctx.beginPath();
                    ctx.arc(20 + Math.cos(angle) * 12, 9 + Math.sin(angle) * 8, 3, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }

            function drawFoodBowl(x, y) {
                ctx.save();
                ctx.translate(x, y);
                ctx.fillStyle = '#8D6E63';
                ctx.beginPath();
                ctx.ellipse(0, 0, 24, 10, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#6D4C41';
                ctx.beginPath();
                ctx.ellipse(0, 2, 20, 8, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#F5B041';
                for (let i = 0; i < 5; i++) {
                    const a = i * 1.2 + 0.3;
                    ctx.beginPath();
                    ctx.arc(Math.cos(a) * 10, Math.sin(a) * 4 + 2, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            // ===== Анимация задач =====
            function animateTask(taskId) {
                if (animating || tasks[taskId]) return;

                animating = true;
                updateUI();

                wife.visible = false;
                dog.visible = false;
                car.visible = false;
                lawnmower.visible = false;
                foodBowl.visible = false;
                man.action = 'idle';
                man.x = 400;
                particles = [];

                const duration = 3500 + Math.random() * 1000;
                let interval = null;

                switch (taskId) {
                    case 0:
                        man.action = 'mowing';
                        man.x = 400;
                        man.walkDir = 1;
                        lawnmower.visible = true;
                        interval = setInterval(() => {
                            addParticles('grass', man.x + 20 + Math.random() * 40, man.y + 20, 3, {
                                spread: 1.0,
                                speed: 80,
                                size: 6,
                                color: ['#4CAF50', '#66BB6A', '#43A047'][Math.floor(Math.random() * 3)]
                            });
                        }, 80);
                        break;
                    case 1:
                        dog.visible = true;
                        foodBowl.visible = true;
                        interval = setInterval(() => {
                            addParticles('star', man.x + 20 + Math.random() * 30, man.y + 10, 2, {
                                spread: 0.5,
                                speed: 50,
                                size: 8,
                                color: '#F5B041'
                            });
                        }, 150);
                        break;
                    case 2:
                        car.visible = true;
                        interval = setInterval(() => {
                            addParticles('spark', man.x - 20 + Math.random() * 60, man.y + 10, 4, {
                                spread: 2.0,
                                speed: 100,
                                size: 5,
                                color: '#F9E79F'
                            });
                            addParticles('spark', man.x - 10 + Math.random() * 40, man.y, 3, {
                                spread: 1.5,
                                speed: 80,
                                size: 4,
                                color: '#F39C12'
                            });
                        }, 120);
                        break;
                    case 3:
                        man.action = 'pushup';
                        interval = setInterval(() => {
                            addParticles('sweat', man.x - 10 + Math.random() * 20, man.y - 10, 2, {
                                spread: 0.3,
                                speed: 30,
                                size: 5
                            });
                        }, 180);
                        break;
                    case 4:
                        wife.visible = true;
                        man.action = 'hug';
                        interval = setInterval(() => {
                            addParticles('heart', man.x - 20 + Math.random() * 40, man.y - 30 + Math.random() *
                                20, 2, {
                                    spread: 0.6,
                                    speed: 80,
                                    size: 12,
                                    color: ['#E74C3C', '#F1948A', '#F5B7B1'][Math.floor(Math.random() *
                                    3)]
                                });
                        }, 150);
                        break;
                }

                animTimer = setTimeout(() => {
                    tasks[taskId] = true;
                    animating = false;
                    if (interval) clearInterval(interval);
                    man.action = 'idle';
                    man.x = 400;
                    wife.visible = false;
                    dog.visible = false;
                    car.visible = false;
                    lawnmower.visible = false;
                    foodBowl.visible = false;
                    particles = [];
                    updateUI();
                    animTimer = null;
                }, duration + 300);
            }

            // ===== Победа =====
            function showVictory() {
                if (victoryShown) return;
                victoryShown = true;
                victory.classList.add('show');

                let count = 0;
                const fwInterval = setInterval(() => {
                    if (count > 30) { clearInterval(fwInterval); return; }
                    addParticles('star', 100 + Math.random() * 600, 100 + Math.random() * 200, 5, {
                        spread: 2.0,
                        speed: 100 + Math.random() * 80,
                        size: 10,
                        color: ['#F1C40F', '#E74C3C', '#2ECC71', '#3498DB'][Math.floor(Math.random() * 4)]
                    });
                    addParticles('heart', 100 + Math.random() * 600, 100 + Math.random() * 200, 3, {
                        spread: 1.5,
                        speed: 80 + Math.random() * 60,
                        size: 10,
                        color: ['#E74C3C', '#F1948A', '#F5B7B1'][Math.floor(Math.random() * 3)]
                    });
                    count++;
                }, 400);

                setTimeout(() => {
                    const extra = setInterval(() => {
                        if (!victoryShown) { clearInterval(extra); return; }
                        addParticles('star', 100 + Math.random() * 600, 100 + Math.random() * 200, 4, {
                            spread: 2.0,
                            speed: 100 + Math.random() * 60,
                            size: 8,
                            color: ['#F1C40F', '#E74C3C', '#2ECC71', '#3498DB'][Math.floor(Math.random() *
                                4)]
                        });
                    }, 600);
                    setTimeout(() => clearInterval(extra), 8000);
                }, 3000);
            }

            // ===== Главный цикл =====
            function gameLoop() {
                frame++;
                updateManPosition();
                updateParticles();
                drawScene();
                requestAnimationFrame(gameLoop);
            }

            // ===== Обработчики =====
            buttons.forEach((btn, i) => {
                if (i < 5) {
                    btn.addEventListener('click', () => animateTask(i));
                    btn.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        animateTask(i);
                    }, { passive: false });
                }
            });

            restartBtn.addEventListener('click', () => {
                for (let i = 0; i < 5; i++) tasks[i] = false;
                victoryShown = false;
                victory.classList.remove('show');
                man.action = 'idle';
                man.x = 400;
                wife.visible = false;
                dog.visible = false;
                car.visible = false;
                lawnmower.visible = false;
                foodBowl.visible = false;
                particles = [];
                animating = false;
                updateUI();
            });
            restartBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                for (let i = 0; i < 5; i++) tasks[i] = false;
                victoryShown = false;
                victory.classList.remove('show');
                man.action = 'idle';
                man.x = 400;
                wife.visible = false;
                dog.visible = false;
                car.visible = false;
                lawnmower.visible = false;
                foodBowl.visible = false;
                particles = [];
                animating = false;
                updateUI();
            }, { passive: false });

            // ===== Полифилл =====
            if (!CanvasRenderingContext2D.prototype.roundRect) {
                CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                    if (r > w / 2) r = w / 2;
                    if (r > h / 2) r = h / 2;
                    this.moveTo(x + r, y);
                    this.lineTo(x + w - r, y);
                    this.quadraticCurveTo(x + w, y, x + w, y + r);
                    this.lineTo(x + w, y + h - r);
                    this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                    this.lineTo(x + r, y + h);
                    this.quadraticCurveTo(x, y + h, x, y + h - r);
                    this.lineTo(x, y + r);
                    this.quadraticCurveTo(x, y, x + r, y);
                    return this;
                };
            }

            // ===== Старт =====
            updateUI();
            gameLoop();

            console.log('🏠 Симулятор бытовых дел (адаптив для телефонов)');
        })();
    </script>

</body>
